import org.jetbrains.intellij.platform.gradle.TestFrameworkType

buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'java'
    id 'antlr'
    id "org.jetbrains.intellij.platform" version "2.18.1"
}

wrapper {
    gradleVersion = '9.0.0'
}

group 'antlr'
version pluginVersion

def ideaVersionValue = findProperty("ideaVersion")?.toString()
if (!ideaVersionValue || !ideaVersionValue.contains("-")) {
    throw new GradleException("ideaVersion must follow <TYPE>-<VERSION> format (for example: IC-2022.3)")
}
def (platformType, platformVersion) = ideaVersionValue.split("-", 2)
def sinceBuildOverride = findProperty("sinceBuildVersion")?.toString()?.trim()
def untilBuildOverride = findProperty("untilBuildVersion")?.toString()?.trim()

compileJava {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

intellijPlatform {
    buildSearchableOptions = false
    pluginConfiguration {
        id = 'org.antlr.intellij.plugin'
        version = project.version.toString()
        name = 'ANTLR v4'

        ideaVersion {
            sinceBuild = provider { sinceBuildOverride ?: null }
            untilBuild = provider { untilBuildOverride ?: null }
        }
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { // Gets snapshots of antlr if needed
        url "https://oss.sonatype.org/content/repositories/snapshots/"
    }
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        create(platformType, platformVersion)
        testFramework(TestFrameworkType.Platform.INSTANCE)
    }
    antlr("org.antlr:antlr4:$antlr4Version") { // use ANTLR version 4
        exclude group:'com.ibm.icu', module:'icu4j'
    }
    implementation "org.antlr:antlr4-intellij-adaptor:0.1"
    implementation group: 'org.jfree', name: 'org.jfree.svg', version: '5.0.7'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.20.0'
}

generateGrammarSource {
    include("**/ANTLRv4*.g4")

    arguments += [
            "-package", "org.antlr.intellij.plugin.parser",
            "-lib", "src/main/antlr/org/antlr/intellij/plugin/parser",
            "-Xexact-output-dir"
    ]
}

test {
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

runIde {
    jvmArgs '-Xmx8G'
}
